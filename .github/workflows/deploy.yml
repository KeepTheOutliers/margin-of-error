# Refreshes the polling data from Silver Bulletin each day and commits it (Posit Connect
# Cloud republishes the app on each push), then publishes the GitHub Pages page that
# frames the app at a cleaner address. Also runs on every push to main and on demand.
name: Refresh data and deploy

on:
  schedule:
    - cron: "0 13 * * *"   # daily, 13:00 UTC
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        if: github.event_name != 'push'
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        if: github.event_name != 'push'
        with:
          packages: |
            any::dplyr
            any::readr
            any::httr
            any::readxl

      # Current averages and polls daily; pollster ratings and historical polls on Sundays.
      # If Silver Bulletin is unreachable or its files change shape, keep the cached data.
      - name: Refresh data from Silver Bulletin
        if: github.event_name != 'push'
        continue-on-error: true
        run: Rscript -e 'source("R/fetch_data.R"); refresh_all(history = format(Sys.Date(), "%u") == "7")'

      # This push is what makes Posit Connect Cloud republish the app with the new data.
      - name: Commit refreshed data
        if: github.event_name != 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          git diff --cached --quiet || (git commit -m "Refresh polling data" && git push)

      - name: Build the Pages wrapper
        run: mkdir -p _site && cp site/index.html site/og.png _site/

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
